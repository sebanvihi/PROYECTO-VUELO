<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BelViaggio - Inicio</title>
    <link rel="stylesheet" href="../css/pages/inicio.css">
</head>
<body>
    <header class="header">
        <h1 class="header-title">BelViaggio</h1>
        
        <nav class="headerNav">
            <a href="#" id="terminos" class="headerNav-link">Terminos y Condiciones</a>
            <a href="#" id="privacidad" class="headerNav-link">Política de Privacidad</a>
            <a href="#" id="acerca" class="headerNav-link">Acerca de</a>
        </nav>
    </header>
    <main>
        <div class="mainContent">
            <h2>Bienvenido a BelViaggio</h2>
            <p>Explora los mejores destinos turísticos con BelViaggio.</p>
        </div>
        
        <div class="seleccionador">
            <div class="radio-group">
                <div class = "grupo-ida">
                    <input type="radio" id="ida" name="tipoViaje">
                    <label for="ida">IDA</label>
                </div>
                <div class = "grupo-vuelta"> 
                    <input type="radio" id="vuelta" name="tipoViaje" checked>
                    <label for="vuelta">IDA Y VUELTA</label>
                </div>
            </div>

            <div class="contenedor-inputs">
                <div class="input-grupo">
                    <label for="origen">Origen</label>
                    <input type="text" placeholder="Selecciona un origen..." id="origen">
                </div>
                
                <div class="input-grupo">
                    <label for="destino">Destino</label>
                    <input type="text" placeholder="Selecciona un destino..." id="destino">
                </div>
            </div>

            <div class="contenedor-botones">
                <button class="reservar">Reservar</button>
                
                <button class="vuelos" onclick="window.location.href='vuelos.html'">Vuelos Disponibles</button>
            </div>
        </div>
    </main> 
</body>

</html>
