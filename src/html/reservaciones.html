<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BelViaggio - Reservaciones</title>
    <link rel="stylesheet" href="../css/layouts/divs.css">
    <link rel="stylesheet" href="../css/components/botones.css">
    <link rel="stylesheet" href="../css/pages/reservaciones.css">
</head>
<body>
    <header class="header">
        <div class="header-logo-container">
            <h1><a href="index.html" style="text-decoration: none; color: inherit;">BelViaggio</a></h1>
        </div>
        <div class="progreso-reserva">
            <span class="nodo">1</span><span class="linea"></span>
            <span class="nodo">2</span><span class="linea"></span>
            <span class="nodo activo">3</span>
        </div>
        <nav class="headerNav">
            <a href="#" id="terminos" class="headerNav-link">Términos y Condiciones</a>
            <a href="#" id="privacidad" class="headerNav-link">Política de Privacidad</a>
            <a href="#" id="acerca" class="headerNav-link">Acerca de</a>
        </nav>
    </header>

    <div class="contenido-principal">
        <aside class="panel-izquierdo">
            <div class="tabla-modelos contenedor-menu">
                <h3>Clases de Asientos</h3>
                <div class="modelo-item">
                    <div class="asiento club demo">A</div>
                    <span>Economy Club</span>
                </div>
                <div class="modelo-item">
                    <div class="asiento premium demo">A</div>
                    <span>Premium</span>
                </div>
                <div class="modelo-item">
                    <div class="asiento turista demo">A</div>
                    <span>Turista</span>
                </div>
            </div>
        </aside>

        <main>
            <div id="avion-container" class="contenedor-avion">
                <div class="leyenda">
                    <div><span class="color-verde"></span> Disponible</div>
                    <div><span class="color-amarillo"></span> Emergencia</div>
                    <div><span class="color-rojo"></span> Ocupado</div>
                </div>
                
                <div class="avion-scroll">
                    <div class="silueta-avion">
                        <div class="nariz-avion"></div>
                        <div id="mapa-asientos" class="mapa-asientos">
                            </div>
                        <div class="cola-avion"></div>
                    </div>
                </div>
            </div>
        </main>

        <aside>
            <div id="menu-pasajeros" class="contenedor-menu">
                <h3>Pasajeros</h3>
                <div id="lista-pasajeros-actual"></div>
            </div>



            <div class="advertencias">
                <h3>Advertencias</h3>
                <p>Menores no pueden ir en salidas de emergencia.</p>
            </div>

            <div class="contenedor-botones-reserva">
                <button id="btn-asignar" class="btn-accion">Asignar Asiento</button>
                <div class="avance-botones">
                    <button id="btn-confirmar" class="btn-accion">Confirmar</button>
                    <button id="btn-regresar" class="btn-accion secundario">Regresar</button>
                </div>
            </div>
        </aside>
    </div>

    <script src="../js/reservaciones.js"></script>
</body>
</html>
